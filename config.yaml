# Stage 2 — Reasoning Methods in LLMs
# Shared configuration for experiments E2.1 through E2.4
# Edit values here; scripts read this file at startup.

# ---------------------------------------------------------------------------
# Common
# ---------------------------------------------------------------------------
common:
  seed: 42
  device: "cuda"               # "cuda" | "cpu"
  dtype: "bfloat16"            # "bfloat16" | "float16" | "float32"
  output_dir: "outputs"        # local output dir (always written)
  drive_output_dir: "/content/drive/MyDrive/research_stage_02/outputs" # leave blank to skip Drive save
                               

# ---------------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------------
models:
  main: "Qwen/Qwen2.5-7B-Instruct"
  base: "Qwen/Qwen2.5-7B"                       # E2.1 ablation: same model without instruction tuning
  grpo_policy: "Qwen/Qwen2.5-1.5B-Instruct"   # E2.3: small model for GRPO
  outcome_rm: ""                                # E2.4: leave blank to train from scratch
  process_rm: ""

# ---------------------------------------------------------------------------
# E2.1 — CoT from scratch
# ---------------------------------------------------------------------------
e2_1:
  dataset: "openai/gsm8k"
  dataset_config: "main"
  split: "test"
  n_eval: 300                  # set to null to use all 1319

  conditions:
    - "direct"
    - "zero_shot_cot"
    - "few_shot_cot"           # hand-written exemplars
    - "few_shot_cot_wei"       # standard 8 GSM8K exemplars from Wei et al. (2022)

  # ---- Prompt templates ----
  prompts:
    direct:
      system: >-
        You are a math assistant.
        Output only the final numeric answer — a single number, nothing else.
      # No user prefix; question is passed as-is

    zero_shot_cot:
      system: >-
        You are a math assistant.
        Think step by step, then state the final answer as: 'The answer is <number>.'
      user_suffix: "\n\nLet's think step by step."

    # Few-shot conditions: exemplars are injected as alternating user/assistant turns.
    # Both use the same system prompt so only the exemplars differ.
    few_shot_cot:
      system: >-
        You are a math assistant.
        Solve each problem step by step and end with 'The answer is <number>.'
      exemplars_file: "few_shot_exemplars.jsonl"

    few_shot_cot_wei:
      system: >-
        You are a math assistant.
        Solve each problem step by step and end with 'The answer is <number>.'
      exemplars_file: "few_shot_exemplars_wei.jsonl"

  # ---- Base-model prompts (used with --model base) ----
  # A base model has no chat template, so prompts are plain text in the
  # "Q: ... A: ..." format of Wei et al. (2022) and Kojima et al. (2022).
  # No system prompt. Few-shot conditions reuse the exemplar files above.
  base_prompts:
    direct:
      # Wei et al.'s "standard prompting": the same exemplars with the reasoning
      # removed ("A: The answer is 6."). A base model ignores a one-line
      # instruction to answer with a number; exemplars set the format.
      exemplars_file: "few_shot_exemplars_wei.jsonl"
    zero_shot_cot:
      reasoning_prefix: "Let's think step by step."
      # Kojima et al.'s second stage: appended after the reasoning to get the answer.
      answer_trigger: "Therefore, the answer (arabic numerals) is"
      answer_max_new_tokens: 32
    # Generation stops here so the model does not invent the next question.
    # A base model may continue with invented problems in several formats.
    stop_strings: ["\nQ:", "\nQuestion:", "\n[Question]"]

  # ---- Generation (greedy) ----
  # Qwen2.5's generation_config.json adds repetition_penalty=1.05 unless
  # overridden; 1.0 disables it so decoding is plain greedy.
  generation:
    direct:
      max_new_tokens: 64
      do_sample: false
      repetition_penalty: 1.0
    cot:                       # applies to all CoT conditions
      max_new_tokens: 512
      do_sample: false
      repetition_penalty: 1.0

# ---------------------------------------------------------------------------
# E2.2 — Self-consistency (majority voting)
# ---------------------------------------------------------------------------
e2_2:
  dataset: "openai/gsm8k"
  dataset_config: "main"
  split: "test"
  n_eval: 300                  # same seed as E2.1 → these are E2.1's first 300 questions

  # max(k_values) samples are drawn per question once; smaller k are evaluated
  # by voting over random subsets of those samples (n_resamples subsets per k).
  k_values: [1, 4, 8, 16, 32]
  n_resamples: 100             # subsets per (question, k) for the expected accuracy
  n_bootstrap: 1000            # bootstrap resamples over questions for 95% CIs

  # Same prompt as E2.1 zero_shot_cot, so k=1 vs greedy isolates the effect of sampling.
  prompts:
    system: >-
      You are a math assistant.
      Think step by step, then state the final answer as: 'The answer is <number>.'
    user_suffix: "\n\nLet's think step by step."

  generation:
    max_new_tokens: 512
    do_sample: true
    temperature: 0.7
    top_p: 0.95
    # Qwen2.5's generation_config.json silently adds top_k=20 and
    # repetition_penalty=1.05. Set explicitly so only temperature/top_p apply.
    top_k: 0                   # 0 = disabled
    repetition_penalty: 1.0    # 1.0 = disabled
    samples_per_batch: 32      # sequences generated in parallel; lower to 16/8 on OOM

  # Optional: path to an E2.1 results JSON. Its zero_shot_cot (greedy) records are
  # matched to E2.2 questions by text and compared with an exact McNemar test.
  greedy_ref: ""

  # Checkpoint after every question so a Colab disconnect doesn't lose the run.
  # Written to drive_output_dir when set, otherwise output_dir.
  checkpoint_file: "e2_2_checkpoint.jsonl"

# ---------------------------------------------------------------------------
# E2.3 — GRPO by hand
# ---------------------------------------------------------------------------
e2_3:
  task: "arithmetic"           # "arithmetic" | "string_manipulation"
  n_train: 2000
  n_eval: 200

  prompts:
    system: >-
      You are a math assistant. Solve the arithmetic problem.
      Output your reasoning then state the answer as: 'The answer is <number>.'

  grpo:
    group_size: 8
    lr: 1.0e-5
    epochs: 3
    batch_size: 4
    max_new_tokens: 128
    temperature: 0.9
    kl_coef: 0.01
    clip_eps: 0.2
    max_grad_norm: 1.0

  # Dr. GRPO (Liu et al., 2025, arXiv:2503.20783) removes two biases in the GRPO
  # objective; it does not add a length penalty.
  #   - length bias: GRPO divides each response's token loss by its own length
  #     |o_i|, which favours long wrong answers and short right ones. Dr. GRPO
  #     sums over tokens and divides by a constant (here max_new_tokens).
  #   - difficulty bias: GRPO divides the advantage by the group's reward std.
  #     Dr. GRPO uses A_i = r_i - mean(r_group) only.
  dr_grpo:
    enabled: true
    normalize_by_length: false   # true = original GRPO (divide by |o_i|)
    scale_by_std: false          # true = original GRPO (divide by std of group rewards)

# ---------------------------------------------------------------------------
# E2.4 — Verifier study
# ---------------------------------------------------------------------------
e2_4:
  dataset: "openai/gsm8k"
  dataset_config: "main"
  n_train_traces: 5000
  n_eval: 300

  best_of_n_values: [1, 4, 8, 16, 32]

  prompts:
    generator_system: >-
      You are a math assistant.
      Think step by step, then state the final answer as: 'The answer is <number>.'
    generator_user_suffix: "\n\nLet's think step by step."

  outcome_rm_training:
    epochs: 3
    lr: 2.0e-5
    batch_size: 16
    max_seq_len: 512

  process_rm_training:
    epochs: 3
    lr: 2.0e-5
    batch_size: 8
    max_seq_len: 1024
    step_label_strategy: "outcome_propagation"
